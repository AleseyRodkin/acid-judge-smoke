name: acid-judge-smoke

on:
  push:
  pull_request:

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: AleseyRodkin/acid-engine@v0.2.32
        with:
          index: locks/index.json
          judge: true

  tamper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Swap body
        run: sed -i 's/cents \* qty/cents * qty * 2/' tools/compute_amount.py
      - uses: AleseyRodkin/acid-engine@v0.2.32
        id: judge
        continue-on-error: true
        with:
          index: locks/index.json
      - name: Tamper must FAIL
        run: test "${{ steps.judge.outcome }}" = "failure"

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install Acid Judge
        run: pip install acid-judge==0.2.32
      - name: Run smoke
        run: chmod +x smoke.sh && ./smoke.sh
