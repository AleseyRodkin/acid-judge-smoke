name: acid-judge-smoke

on:
  push:
  pull_request:

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: AleseyRodkin/acid-engine-2.0@v0.2.17
        with:
          index: locks/index.json
          judge: true

  tamper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Swap body
        run: sed -i 's/cents \* qty/cents * qty * 2/' tools/compute_amount.py
      - uses: AleseyRodkin/acid-engine-2.0@v0.2.17
        id: judge
        continue-on-error: true
        with:
          index: locks/index.json
      - name: Tamper must FAIL
        run: test "${{ steps.judge.outcome }}" = "failure"

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Acid Judge
        run: pip install "acid-judge @ git+https://github.com/AleseyRodkin/acid-engine-2.0.git@v0.2.17"
      - name: Run smoke
        run: chmod +x smoke.sh && ./smoke.sh
